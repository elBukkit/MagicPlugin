abyss_floor:
  class: Perlin
  elevation: 1 | 6
  noise: 0.1
  blocks:
    - sand

abyss_magma:
  class: Random
  generators:
    none: 30
    abyss_magma_block: 1

abyss_water:
  class: Flat
  height: 260
  blocks: water

abyss_ceiling:
  class: Flat
  height: 1
  y_offset: 220
  blocks: black_concrete

abyss_barrier:
  class: Flat
  height: 1
  y_offset: 200
  blocks: barrier[waterlogged=true]

abyss:
  class: Sequence
  biome: deep_ocean
  populators:
    - abyss_leviathan
  generators:
    - bedrock
    - abyss_water
    - abyss_ceiling
    - abyss_barrier
    - abyss_floor
    - abyss_magma
