  elevation: 1 | 6
  noise: 0.1
  blocks:
    - sand

abyss_water:
  class: Flat
  height: 260
  blocks: water

abyss_ceiling:
  class: Flat
  height: 1
  y_offset: 220
  blocks: black_concrete

abyss_barrier:
  class: Flat
  height: 1
  y_offset: 200
