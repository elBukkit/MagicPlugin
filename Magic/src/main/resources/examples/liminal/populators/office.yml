office_lights:
  class: Repeat
  repeat: 0 | 20
  populator:
    class: Light
    floor_probability: 0
    position: 2 | 14
    light_blocks:
      - pearlescent_froglight

office_portal:
  class: EndGateway
  target_world: world_bliss
  height: 10
  size: 8
  position: 8

office_lobby_portal:
  class: EndGateway
  target_world: world_lobby
  height: 10
  size: 2
  position: 2

office_furniture:
  class: Repeat
  repeat: 4
  populator:
    class: Spawn
    spawn_offset: 0.5,-0.05,0.5
    types:
      modern_table: 5
      office_chair: 20
      office_table: 5
      white_table: 10
      none: 60
