commands:
  no_permission: '&cNie masz uprawnień do użycia tej komendy.'
  in_game: '&cTę komendę można używać tylko w grze.'
  unknown_command: '&cNieznana komenda: &f$command'
  mconfig:
    write_failed: '&cNie udało się zapisać pliku $file'
    example:
      usage: '&cUżycie: /mconfig example [$akcje]'
      list:
        base: '&bPrzykład bazowy: &3$example'
        header: '&bPrzykłady:'
        item: '  &f- &3$example'
      fetch:
        usage: '&cUżycie: /mconfig example fetch <nazwa przykładu> <url>'
        unknown: |-
          &cNieznany przykład: &e$example, &c najpierw użyj url, aby go pobrać.&r
          &cUżycie: /mconfig example fetch <nazwa przykładu> <url>
        fail: '&cNie udało się pobrać url &e$url'
        error: '&cCoś poszło nie tak, sprawdź logi'
        wait: '&bProszę czekać, pobieranie &b$url...'
        success: |-
          &bPrzykład pobrany &2$example&f
          &rUżyj &6/mconfig example add $example&f, aby połączyć to z obecną konfiguracją
          &rUżyj &6/mconfig example set $example&f, aby ustawić to jako bazową konfigurację
        backup: '&ePrzykład istnieje, &3tworzenie kopii zapasowej &f$backup'
        overwrite_backup: '&ePrzykład i kopia zapasowa istnieją, &cnadpisywanie &f$backup'
        url_write: '&bMożesz zaktualizować ten przykład w przyszłości za pomocą &6/mconfig example fetch $example&r'
        url_write_failed: '&cCoś poszło nie tak podczas zapisu pliku URL, sprawdź logi'
        url_exists: |-
          &ePrzykład ma wbudowany plik URL, nie nadpisuję.
          &r&fMoże to być przekierowanie do zaktualizowanej wersji.
          &r&&bMożesz spróbować &6/mconfig example fetch $example &b, aby go zaktualizować
      add:
        usage: '&cUżycie: /mconfig example add <przykład>'
        duplicate: '&cPrzykłady &2$examples &csą już załadowane'
        success: '&bDodano przykłady &2$examples'
      remove:
        usage: '&cUżycie: /mconfig example remove <przykład>'
        missing: '&cPrzykład &2$example &cnie jest załadowany'
        all: |-
          &bUsunięto wszystkie przykłady, w tym bazowy.
          &r&bUżyj &6/mconfig example set survival none&b, jeśli nie chciałeś usuwać bazowej konfiguracji przetrwania.
          &r&bW przeciwnym razie użyj &6/magic load&b, aby zastosować zmiany
        success: '&bUsunięto przykład &2$example'
      set:
        success: '&bUstawiono bazowy przykład na &2$example'
        multiple: |-
          &bUstawiono bazowy przykład na &2$example&f
          &r&bUstawiono dodane przykłady na &2$examples
        clear_added: |-
          &bUstawiono bazowy przykład na &2$example&f
          &r&bUsunięto dodane przykłady
        clear: |-
          &bUsunięto bazowy przykład.&f
          &r&bUżyj &g/mconfig example remove all&b, jeśli dodałeś przykłady, które chcesz usunąć
##################################################################################
    disable:
      usage: '&cUżycie: /mconfig disable [$typy] [klucz]'
      nokey: '&cNieprawidłowy typ: $type, opcje: $options'
      success: Wyłączono $type $key, użyj '/magic load', aby zastosować oczekujące zmiany
##################################################################################
    enable:
      usage: '&cUżycie: /mconfig enable [$typy] [klucz]'
      nokey: '&cNieprawidłowy typ: $type, opcje: $options'
      success: Włączono $type $key, użyj '/magic load', aby zastosować oczekujące zmiany
##################################################################################
    configure:
      usage: '&cUżycie: /mconfig configure [$typy] [klucz] [właściwości] [wartość]'
      nokey: '&cNieprawidłowy typ: $type, opcje: $options'
      success: Zmieniono $type $key, użyj '/magic load', aby zastosować oczekujące zmiany
##################################################################################
    reset:
      usage: '&cUżycie: /mconfig reset [$opcje] [klucz] '
      nokey: '&cNieprawidłowy typ: $type, Opcje: $options'
      missing: '&cPlik &f$file &cnie istnieje, brak resetowania'
      nothing: '&cPlik &f$file &cnie istnieje, a &f$key &cnie znaleziono w pliku dostosowań'
      none: '&cNie znaleziono dostosowań do zresetowania'
      removed: '&bUsunięto &3$key &bz pliku dostosowań'
      success: '&bUsunięto &3$file'
      backup: '&7Kopia zapasowa zapisana w &f$backup &7na wypadek, gdybyś chciał cofnąć tę zmianę'
      load_prompt: '&7Użyj &f/magic load &7, aby zastosować oczekujące zmiany'
##################################################################################
    apply:
      usage: '&cUżycie: /mconfig apply [id sesji]'
      wait: '&bPobieranie konfiguracji...'
      error: '&cCoś poszło nie tak, sprawdź logi'
      error_saving: '&cNie udało się zapisać pliku $file'
      overwrote: '&eNadpisano plik &b&a$file'
      created: '&bUtworzono plik &a$file'
      missing: '&cBrak pola $field w odpowiedzi serwera'
      load_prompt: '&7Użyj &f/magic load &7, aby załadować zmiany'
      invalid: '&cPlik zawiera błędy parsowania. Popraw je i spróbuj ponownie.'
##################################################################################
    load:
      usage: '&cUżycie: /mconfig load [id sesji]'
      wait: '&bPobieranie konfiguracji...'
      error: '&cCoś poszło nie tak, sprawdź logi'
      missing: '&cBrak pola $field w odpowiedzi serwera'
      error_saving: '&cNie udało się zapisać pliku $file'
      overwrote: '&eNadpisano plik &b&a$file'
      created: '&bUtworzono plik &a$file'
      invalid: '&cPlik zawiera błędy parsowania. Popraw je i spróbuj ponownie.'
##################################################################################
    editor:
      usage: '&cUżycie: /mconfig editor [$opcje]'
      error: '&cCoś poszło nie tak, sprawdź logi'
      wait: '&bProszę czekać, uruchamianie nowej sesji...'
      server_error: '&cCoś poszło nie tak, serwer mówi: &e$message'
      new_session: '&3Przejdź do &f$url &3w przeglądarce'
      new_item: '&3Tworzenie nowego &2$type.&b$item'
      edit_item: '&3Edycja &2$type.&b$item'
##################################################################################
  modifier:
    usage: 'Użycie: /mage modifier <add|remove> <modyfikator> [czas trwania]'
    add:
      success: Dodano modyfikator $name do $player
      success_duration: Dodano modyfikator &3$name &fdo &6$player &fna $duration
      fail: '&cNie udało się dodać modyfikatora &3$name &fdo &6$player, &fmógł już go mieć'
      invalid: '&cNieprawidłowy czas trwania: $input'
    remove:
      success: Usunięto modyfikator &3$name &fz &6$player
      fail: '&cNie udało się usunąć modyfikatora &3$name &fz &6$player, &fmógł go nie mieć'
##################################################################################
  getrp:
    auto: Odtąd będziesz automatycznie otrzymywać paczkę zasobów podczas logowania
    manual: Preferencje RP usunięte, przy następnym logowaniu zostaniesz ponownie zapytany.
    turnoff: |-
      Nie będziesz już automatycznie otrzymywać paczki zasobów podczas logowania ani nie będziesz pytany.
      &rUżyj &6/getrp&f, jeśli chcesz ją zdobyć.
      &rJeśli wolisz pobrać RP, możesz użyć &6/getrp url&f, aby uzyskać adres URL
    sending: |-
      Użyj &6/getrp auto&f, aby automatycznie otrzymywać paczkę zasobów.
      &rLub użyj &6/getrp off&f, aby wyłączyć komunikat logowania.
    preference: |-
      Preferencje RP ustawione na &3$pack&f
      Użyj &6/getrp default&f, aby zmienić z powrotem.
    noauto: Użyj &6/getrp auto &f, aby automatycznie otrzymywać tę paczkę podczas logowania
    default: Preferencje RP przywrócono do domyślnych
    disabled: Ta komenda została wyłączona, ponieważ ten serwer ma paczkę zasobów skonfigurowaną w server.properties
